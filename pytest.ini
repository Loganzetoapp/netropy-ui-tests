[pytest]
markers =
    smoke: 2-minute sanity set, run anytime
    hardware_free: no traffic generated, safe to run anytime, parallelizable
    stateful: generates real traffic on the box, serial only, coordinate before running
    quarantine: known flaky, excluded from default runs
addopts = --junitxml=results/junit.xml -m "not quarantine" --screenshot only-on-failure --output results/artifacts
testpaths = tests
